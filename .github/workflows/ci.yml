name: CI

on:
  pull_request:
  push:
    branches:
      - "claude/**"
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build against the bundled snapshot so CI needs no secrets or network.
      MARKET_DATA_PROVIDER: snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
